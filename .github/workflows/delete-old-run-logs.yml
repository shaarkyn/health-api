# One-off cleanup, approved by Petr on 2026-10-07 ("Smazat logy"): deletes the
# logs, not the runs, of every run that printed health data into the public
# Actions log before #81 went live (merged 2026-10-07 05:21:49 UTC). Runs once
# on the push that adds this file, which is removed again right after and never
# merged. Prints only counts.
name: Delete old run logs (one-off)

on:
  push:
    branches:
      - claude/project-thread-atttaz
    paths:
      - .github/workflows/delete-old-run-logs.yml

permissions:
  actions: write

jobs:
  delete-logs:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Delete the logs of runs before #81
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: "2026-10-07T05:21:50Z"
        shell: bash
        run: |
          set -uo pipefail

          # GITHUB_TOKEN allows 1,000 API requests an hour: when they are used
          # up, wait for the next hour.
          wait_for_api_limit() {
            local remaining reset now
            read -r remaining reset < <(gh api rate_limit --jq '.resources.core | "\(.remaining) \(.reset)"' 2>/dev/null || echo "1 0")
            [ "$remaining" = "0" ] || return 1
            now="$(date +%s)"
            echo "API limit reached, waiting $(( reset - now + 10 )) s"
            sleep $(( reset > now ? reset - now + 10 : 10 ))
          }

          problems=0
          failed_in_a_row=0
          delete_logs() {
            local workflow="$1" filter="$2" ids id code total=0 deleted=0 gone=0 failed=0
            if ! ids="$(gh api --paginate "repos/$REPO/actions/workflows/$workflow/runs?per_page=100" \
                --jq ".workflow_runs[] | select(.created_at < \"$BEFORE\") | select($filter) | .id")"; then
              echo "$workflow: could not list runs"
              problems=$((problems + 1))
              return
            fi
            for id in $ids; do
              total=$((total + 1))
              for attempt in 1 2 3 4 5; do
                code="$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
                  -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/$REPO/actions/runs/$id/logs")" || code=000
                if [ "$code" = "403" ] || [ "$code" = "429" ]; then
                  wait_for_api_limit || sleep 60   # otherwise GitHub's per-minute limit
                elif [ "${code:0:1}" = "5" ] || [ "$code" = "000" ]; then
                  sleep 5
                else
                  break
                fi
              done
              case "$code" in
                204) deleted=$((deleted + 1)); failed_in_a_row=0 ;;
                404|410) gone=$((gone + 1)); failed_in_a_row=0 ;;
                *)
                  failed=$((failed + 1)); failed_in_a_row=$((failed_in_a_row + 1))
                  echo "$workflow: run $id answered HTTP $code"
                  if [ "$failed_in_a_row" -ge 5 ]; then echo "Stopping after 5 failures in a row"; exit 1; fi
                  ;;
              esac
              sleep 1   # stay under GitHub's limit for write requests per minute
            done
            echo "$workflow: $total runs, logs deleted $deleted, already without logs $gone, failed $failed"
            problems=$((problems + failed))
          }

          # These printed whole API responses on every run.
          for workflow in strength-maintenance.yml health-strength.yml nutrition.yml \
              nutrition-cleanup.yml one-time-food-log.yml planned-calorie-cleanup.yml; do
            delete_logs "$workflow" 'true'
          done
          # The deploy printed a response only when a smoke test failed.
          delete_logs deploy-worker.yml '.conclusion != "success" and .conclusion != "skipped"'
          [ "$problems" -eq 0 ] || { echo "$problems problems, see above"; exit 1; }
